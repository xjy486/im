spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: jitong-im-server
  servlet:
    multipart:
      # Leave a small parser headroom so ImageNormalizer can return the stable
      # MEDIA_TOO_LARGE error instead of the servlet container closing the upload.
      max-file-size: ${MEDIA_MAX_INPUT_SIZE:11MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:12MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jitong}
    username: ${DB_USERNAME:jitong}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:16}
      minimum-idle: ${DB_MIN_IDLE:2}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

jitong:
  admin:
    api-key: ${ADMIN_API_KEY:}
  auth:
    access-token-lifetime: ${AUTH_ACCESS_TOKEN_LIFETIME:15m}
    refresh-token-lifetime: ${AUTH_REFRESH_TOKEN_LIFETIME:30d}
    login-rate-limit:
      max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      window: ${AUTH_LOGIN_RATE_WINDOW:1m}
      block: ${AUTH_LOGIN_RATE_BLOCK:1m}
  group:
    invite-deep-link-base: ${GROUP_INVITE_DEEP_LINK_BASE:https://app.jitong.im/groups/invite}
    dissolution-purge-interval: ${GROUP_DISSOLUTION_PURGE_INTERVAL:3600000}
    dissolution-purge-initial-delay: ${GROUP_DISSOLUTION_PURGE_INITIAL_DELAY:60000}
  media:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:jitong-local}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:jitong-media}
    orphan-cleanup-grace: ${MINIO_ORPHAN_CLEANUP_GRACE:24h}
  push:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    token-encryption-key: ${FCM_TOKEN_ENCRYPTION_KEY:}
  ai:
    prompt-version: ${AI_PROMPT_VERSION:summary-v1}
    retention-interval: ${AI_RETENTION_INTERVAL:60000}
    retention-initial-delay: ${AI_RETENTION_INITIAL_DELAY:60000}
    provider:
      enabled: ${AI_PROVIDER_ENABLED:false}
      base-url: ${AI_PROVIDER_BASE_URL:}
      api-key: ${AI_PROVIDER_API_KEY:}
      model: ${AI_PROVIDER_MODEL:gpt-4o-mini}
    worker:
      poll-interval: ${AI_WORKER_POLL_INTERVAL:250}
    budget:
      daily-token-limit: ${AI_DAILY_TOKEN_LIMIT:100000}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
