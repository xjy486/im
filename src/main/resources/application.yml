spring:
  application:
    name: jitong-im-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jitong}
    username: ${DB_USERNAME:jitong}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:16}
      minimum-idle: ${DB_MIN_IDLE:2}
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

jitong:
  admin:
    api-key: ${ADMIN_API_KEY:}
  auth:
    access-token-lifetime: ${AUTH_ACCESS_TOKEN_LIFETIME:15m}
    refresh-token-lifetime: ${AUTH_REFRESH_TOKEN_LIFETIME:30d}
    login-rate-limit:
      max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      window: ${AUTH_LOGIN_RATE_WINDOW:1m}
      block: ${AUTH_LOGIN_RATE_BLOCK:1m}
  media:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:jitong-local}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:jitong-media}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
