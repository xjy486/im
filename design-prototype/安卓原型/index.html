<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即通 IM · T04 私人 AI 助手原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="prototype-shell">
    <header class="prototype-header">
      <div>
        <p class="eyebrow">JI TONG IM / T04</p>
        <h1>私人 AI 助手</h1>
        <p class="lede">基于 Ardot 设计源稿的 Android 细化状态与可点击交互原型。</p>
      </div>
      <div class="header-meta">
        <span class="meta-pill">Android · 393×852</span>
        <span class="meta-pill">完整 App · 本地 Mock</span>
      </div>
    </header>

    <section class="prototype-grid">
      <aside class="flow-nav" aria-label="原型流程">
        <div class="nav-heading">
          <span>产品域</span>
          <span id="screen-counter" class="counter">1 / 52</span>
        </div>
        <div id="domain-tabs" class="domain-tabs"></div>
        <div class="nav-heading route-heading">
          <span>屏幕流程</span>
        </div>
        <div id="flow-list" class="flow-list"></div>
        <div class="nav-note">
          <strong>设计约束</strong>
          <p>AI 不自动发言。所有回复必须经过编辑或确认后才会发送。</p>
        </div>
      </aside>

      <section class="phone-stage" aria-label="Android 原型预览">
        <div class="phone-frame">
          <div id="phone-screen" class="phone-screen"></div>
        </div>
        <div class="stage-controls">
          <button class="ghost-button" data-action="previous">上一屏</button>
          <button class="primary-button" data-action="next">下一屏</button>
        </div>
      </section>

      <aside class="inspector" aria-label="交互状态检查器">
        <div class="inspector-heading">
          <span>交互状态</span>
          <span id="status-badge" class="status-badge">IDLE</span>
        </div>
        <div id="state-summary" class="inspector-card"></div>
        <div class="inspector-card">
          <div class="card-kicker">本屏入口</div>
          <p id="screen-entry">聊天页 AI 入口</p>
          <div class="card-kicker">下一步</div>
          <p id="screen-next">打开 AI 助手</p>
        </div>
        <button class="reset-button" data-action="reset">重置原型</button>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
