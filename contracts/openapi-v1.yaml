        width: { type: integer, minimum: 1, maximum: 2048 }
        height: { type: integer, minimum: 1, maximum: 2048 }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    SyncEvent:
      type: object
      additionalProperties: false
      required: [syncSeq, eventType, entityId, conversationId, createdAt]
      properties:
        syncSeq: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string }
        entityId: { type: string, format: uuid }
        conversationId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    SyncPage:
      type: object
      additionalProperties: false
      required: [version, afterSeq, highWatermark, untilSeq, nextAfterSeq, hasMore, events]
      properties:
        version: { const: 1 }
        afterSeq: { type: integer, format: int64, minimum: 0 }
        highWatermark: { type: integer, format: int64, minimum: 0 }
        untilSeq: { type: integer, format: int64, minimum: 0 }
        nextAfterSeq: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/SyncEvent' }
    SyncAckResponse:
      type: object
      additionalProperties: false
      required: [version, deviceId, ackedSeq]
      properties:
        version: { const: 1 }
        deviceId: { type: string, format: uuid }
        ackedSeq: { type: integer, format: int64, minimum: 0 }
    AiConsentResponse:
      type: object
      additionalProperties: false
      required: [version, conversationId, userId, enabled, enabledForBoth, policyVersion]
      properties:
        version: { const: 1 }
        conversationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        enabled: { type: boolean }
        enabledForBoth: { type: boolean }
        policyVersion: { type: integer, format: int64, minimum: 1 }
    AiSummary:
      type: object
      additionalProperties: false
      required: [overview, keyPoints, decisions, openQuestions, sourceMessageIds]
      properties:
        overview: { type: string, minLength: 1, maxLength: 4000 }
        keyPoints:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
        decisions:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
        openQuestions:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1 }
        sourceMessageIds:
          type: array
          items: { type: string, format: uuid }
    AiSmartReplies:
      type: object
      additionalProperties: false
      required: [replies]
      properties:
        replies:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [text, tone]
            properties:
              text: { type: string, minLength: 1, maxLength: 2000 }
              tone: { type: string, minLength: 1, maxLength: 40 }
    AiExtraction:
      type: object
      additionalProperties: false
      required: [actionItems, keyFacts]
      properties:
        actionItems:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [title, details, assigneeUserId, dueAt, priority, confidence, sourceMessageIds]
            properties:
              title: { type: string, minLength: 1, maxLength: 500 }
              details: { type: string, maxLength: 4000 }
              assigneeUserId: { type: [string, 'null'], format: uuid }
              dueAt: { type: [string, 'null'], format: date-time }
              priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
              confidence: { type: number, minimum: 0, maximum: 1 }
              sourceMessageIds:
                type: array
                minItems: 1
                items: { type: string, format: uuid }
        keyFacts:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [category, content, confidence, sourceMessageIds]
            properties:
              category: { type: string, minLength: 1, maxLength: 80 }
              content: { type: string, minLength: 1, maxLength: 4000 }
              confidence: { type: number, minimum: 0, maximum: 1 }
              sourceMessageIds:
                type: array
                minItems: 1
                items: { type: string, format: uuid }
    AiJobStatusResponse:
      type: object
      additionalProperties: false
      required: [version, jobId, conversationId, kind, status, errorCode, createdAt, expiresAt]
      properties:
        version: { const: 1 }
        jobId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        kind: { type: string, enum: [SUMMARY, SMART_REPLY, EXTRACTION] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AiJobResponse:
      type: object
      additionalProperties: false
      required:
        [version, jobId, ownerUserId, requestingDeviceId, conversationId, requestId,
         kind, status, fromSeq, toSeq, model, promptVersion, errorCode,
         createdAt, startedAt, finishedAt, expiresAt, result]
      properties:
        version: { const: 1 }
        jobId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        requestingDeviceId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        kind: { type: string, enum: [SUMMARY, SMART_REPLY, EXTRACTION] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, EXPIRED] }
        fromSeq: { type: integer, format: int64, minimum: 1 }
        toSeq: { type: integer, format: int64, minimum: 1 }
        model: { type: string, minLength: 1 }
        promptVersion: { type: string, minLength: 1 }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        result:
          oneOf:
            - { $ref: '#/components/schemas/AiSummary' }
            - { $ref: '#/components/schemas/AiSmartReplies' }
            - { $ref: '#/components/schemas/AiExtraction' }
            - { type: 'null' }
    AiArtifactResponse:
      type: object
      additionalProperties: false
      required: [version, artifactId, jobId, conversationId, artifactType, content, createdAt, expiresAt]
      properties:
        version: { const: 1 }
        artifactId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        artifactType: { type: string, enum: [SUMMARY, SMART_REPLY, EXTRACTION] }
        content:
          oneOf:
            - { $ref: '#/components/schemas/AiSummary' }
            - { $ref: '#/components/schemas/AiSmartReplies' }
            - { $ref: '#/components/schemas/AiExtraction' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AiActionItemResponse:
      type: object
      additionalProperties: false
      required:
        [version, actionItemId, sourceJobId, ownerUserId, conversationId,
         assigneeUserId, title, details, dueAt, priority, confidence,
         sourceMessageIds, status, createdAt, completedAt]
      properties:
        version: { const: 1 }
        actionItemId: { type: string, format: uuid }
        sourceJobId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        assigneeUserId: { type: [string, 'null'], format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        details: { type: string, maxLength: 4000 }
        dueAt: { type: [string, 'null'], format: date-time }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sourceMessageIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, COMPLETED] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
  responses:
    ApiError:
      description: Versioned error response
      headers:
        X-Request-Id:
          description: UUIDv4 request correlation identifier
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: './schemas/error-response-v1.schema.json'
