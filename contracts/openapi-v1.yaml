openapi: 3.1.0
info:
  title: Jitong Server Contract
  version: 1.0.0
  description: Baseline operational contract. Business endpoints are added in later tracer bullets.
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a user, allocate an immutable account number, and start a MOBILE or PC session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, password, installationId]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '.*\S.*'
                password:
                  type: string
                  minLength: 8
                  maxLength: 256
                  pattern: '.*\S.*'
                deviceClass:
                  type: string
                  enum: [MOBILE, PC]
                  default: MOBILE
                installationId:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Registered user and initial device credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password and rotate the current device credentials
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: '.*\S.*'
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                  pattern: '.*\S.*'
      responses:
        '200':
          description: Rotated credentials for the current device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/auth/account:
    delete:
      operationId: deleteAccount
      summary: Permanently delete the authenticated account after ownership checks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: '.*\S.*'
      responses:
        '204': { description: Account permanently retired }
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/users/{userId}/password-reset:
    post:
      operationId: resetUserPassword
      summary: Generate a one-time temporary password for a preset user
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: One-time temporary password; the user must change it after login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/abuse-reports:
    post:
      operationId: createAbuseReport
      summary: Submit a report for an accessible user, group, or message
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbuseReportCreateRequest' }
      responses:
        '200':
          description: Trackable abuse report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbuseReportResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    get:
      operationId: listMyAbuseReports
      summary: List only the authenticated user's own reports
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Private report status list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AbuseReportResponse' }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/abuse-reports:
    get:
      operationId: listAbuseReports
      summary: Review reports through the protected administrator surface
      security: [{ adminApiKey: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, REVIEWING, RESOLVED, DISMISSED] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Content-free report metadata and status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AbuseReportResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/abuse-reports/{reportId}:
    patch:
      operationId: updateAbuseReportStatus
      summary: Move a report through the review lifecycle
      security: [{ adminApiKey: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, REVIEWING, RESOLVED, DISMISSED] }
      responses:
        '200':
          description: Updated report status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbuseReportResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/users/{userId}/suspension:
    post:
      operationId: suspendUser
      summary: Suspend a user and revoke all active credentials
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformSuspensionRequest' }
      responses:
        '204': { description: User suspended }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: restoreUser
      summary: Restore a suspended user
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: User restored }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/groups/{conversationId}/suspension:
    post:
      operationId: suspendPublicGroup
      summary: Pause a public group and hide it from discovery and entry
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformSuspensionRequest' }
      responses:
        '204': { description: Public group paused }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: restorePublicGroup
      summary: Resume a paused public group
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '204': { description: Public group resumed }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Query content-free security audit metadata
      security: [{ adminApiKey: [] }]
      parameters:
        - name: eventType
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [SUCCEEDED, REJECTED, FAILED] }
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: subjectType
          in: query
          schema: { type: string }
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: requestId
          in: query
          schema: { type: string, format: uuid }
        - name: occurredBefore
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Content-free audit metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogRecord' }
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/system/health:
    get:
      operationId: getServiceHealth
      summary: Report service and dependency health
      responses:
        '200':
          description: PostgreSQL and MinIO are ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, status, components]
                properties:
                  version:
                    const: 1
                  status:
                    type: string
                    const: UP
                  components:
                    type: object
                    additionalProperties:
                      type: string
                    required: [postgresql, minio]
        '503':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/search:
    get:
      operationId: searchUserByAccountNo
      summary: Search one discoverable user by exact account number
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountNo
          in: query
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]{10}$' }
      responses:
        '200':
          description: Minimal discoverable profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactSearchResult' }
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/me/searchability:
    post:
      operationId: updateAccountSearchability
      summary: Enable or disable exact account-number discovery
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searchable]
              properties:
                searchable: { type: boolean }
      responses:
        '204': { description: Searchability updated }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/me/avatar:
    put:
      operationId: replaceUserAvatar
      summary: Replace the authenticated user's cropped avatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uploadId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CropX' }
        - { $ref: '#/components/parameters/CropY' }
        - { $ref: '#/components/parameters/CropWidth' }
        - { $ref: '#/components/parameters/CropHeight' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Versioned user avatar variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: removeUserAvatar
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Avatar removed and version advanced }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/{userId}/avatar:
    get:
      operationId: downloadUserAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: variant
          in: query
          schema: { type: string, enum: [full, thumb], default: full }
        - name: avatarVersion
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Authorized private WebP avatar
          content:
            image/webp:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '410':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/{userId}/profile:
    get:
      operationId: getVisibleUserProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Authorized profile metadata with stable default-avatar fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/avatar:
    put:
      operationId: replaceGroupAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: uploadId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Versioned group avatar variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: removeGroupAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Group avatar removed and version advanced }
        '403':
          $ref: '#/components/responses/ApiError'
    get:
      operationId: downloadGroupAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: query
          schema: { type: string, enum: [full, thumb], default: full }
        - name: avatarVersion
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Authorized private group WebP avatar
          content:
            image/webp:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '410':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups:
    get:
      operationId: listMyGroups
      summary: List active groups the authenticated user belongs to
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active group memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupSummary' }
        '401':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createGroup
      summary: Create a governed group with the authenticated user as OWNER
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '200':
          description: Created group and owner membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupCreateResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/ai-policy:
    get:
      operationId: getGroupAiPolicy
      summary: Read the persistent private AI policy for an active group member
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: Current group AI policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAiPolicyResponse' }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
    patch:
      operationId: updateGroupAiPolicy
      summary: Enable or disable private AI for the group as its OWNER
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAiPolicyUpdate' }
      responses:
        '200':
          description: Updated group AI policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAiPolicyResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/search:
    get:
      operationId: searchGroups
      summary: Search discoverable groups by exact group number or PUBLIC name/description
      security: [{ bearerAuth: [] }]
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Minimal discoverable group results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSearchPage' }
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/members:
    post:
      operationId: addGroupMember
      summary: Directly invite an active user as a MEMBER
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountNo]
              properties:
                accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
      responses:
        '200':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMemberAddResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/members/{userId}:
    delete:
      operationId: removeGroupMember
      summary: Remove an ordinary member so they may apply again later
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Member removed }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/members/{userId}/role:
    put:
      operationId: changeGroupMemberRole
      summary: Change a non-owner group member role; OWNER only
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [ADMIN, MEMBER] }
      responses:
        '200':
          description: Updated group role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupRoleChangeResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/owner-transfer:
    post:
      operationId: transferGroupOwner
      summary: Transfer group ownership to another active member; OWNER only
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupOwnerTransferResponse' }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/leave:
    post:
      operationId: leaveGroup
      summary: Leave an active group as an ordinary member
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '204': { description: Group membership ended }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}:
    delete:
      operationId: dissolveGroup
      summary: Dissolve a group as its OWNER and retire its group number
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '204': { description: Group dissolved; access is revoked immediately and content is retained for 30 days }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/invites:
    post:
      operationId: createGroupInvite
      summary: Create an expiring, usage-limited invitation deep link
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                maxUses: { type: integer, minimum: 1, maximum: 10000, default: 100 }
                expiresInSeconds: { type: integer, minimum: 60, maximum: 2592000, default: 604800 }
      responses:
        '200':
          description: Invitation token metadata and HTTPS deep link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupInviteResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/invites/resolve:
    get:
      operationId: resolveGroupInvite
      summary: Resolve an invitation token into a group application page
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 128 }
      responses:
        '200':
          description: Group application page metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupInviteResolveResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/invites/{inviteId}:
    delete:
      operationId: revokeGroupInvite
      summary: Revoke an invitation token immediately
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Invitation revoked }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
