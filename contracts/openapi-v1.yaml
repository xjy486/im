openapi: 3.1.0
info:
  title: Jitong Server Contract
  version: 1.0.0
  description: Baseline operational contract. Business endpoints are added in later tracer bullets.
paths:
  /api/v1/system/health:
    get:
      operationId: getServiceHealth
      summary: Report service and dependency health
      responses:
        '200':
          description: PostgreSQL and MinIO are ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, status, components]
                properties:
                  version:
                    const: 1
                  status:
                    type: string
                    const: UP
                  components:
                    type: object
                    additionalProperties:
                      type: string
                    required: [postgresql, minio]
        '503':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/search:
    get:
      operationId: searchUserByAccountNo
      summary: Search one discoverable user by exact account number
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountNo
          in: query
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]{10}$' }
      responses:
        '200':
          description: Minimal discoverable profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactSearchResult' }
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/me/searchability:
    post:
      operationId: updateAccountSearchability
      summary: Enable or disable exact account-number discovery
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searchable]
              properties:
                searchable: { type: boolean }
      responses:
        '204': { description: Searchability updated }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/me/avatar:
    put:
      operationId: replaceUserAvatar
      summary: Replace the authenticated user's cropped avatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uploadId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/CropX' }
        - { $ref: '#/components/parameters/CropY' }
        - { $ref: '#/components/parameters/CropWidth' }
        - { $ref: '#/components/parameters/CropHeight' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Versioned user avatar variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: removeUserAvatar
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Avatar removed and version advanced }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/{userId}/avatar:
    get:
      operationId: downloadUserAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: variant
          in: query
          schema: { type: string, enum: [full, thumb], default: full }
        - name: avatarVersion
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Authorized private WebP avatar
          content:
            image/webp:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '410':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/{userId}/profile:
    get:
      operationId: getVisibleUserProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Authorized profile metadata with stable default-avatar fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/avatar:
    put:
      operationId: replaceGroupAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: uploadId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Versioned group avatar variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: removeGroupAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Group avatar removed and version advanced }
        '403':
          $ref: '#/components/responses/ApiError'
    get:
      operationId: downloadGroupAvatar
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: query
          schema: { type: string, enum: [full, thumb], default: full }
        - name: avatarVersion
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Authorized private group WebP avatar
          content:
            image/webp:
              schema: { type: string, format: binary }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '410':
          $ref: '#/components/responses/ApiError'
  /api/v1/groups/{conversationId}/profile:
    get:
      operationId: getGroupAvatarProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Group avatar metadata for a member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupProfile' }
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/contact-requests:
    get:
      operationId: listContactRequests
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contact request history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContactRequestSummary' }
    post:
      operationId: createContactRequest
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '200':
          description: Request state after creation or cross-request acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRequestResponse' }
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/contact-requests/{requestId}/accept:
    post:
      operationId: acceptContactRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: Accepted request and shared conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRequestResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/contact-requests/{requestId}/reject:
    post:
      operationId: rejectContactRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: Rejected request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRequestResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/contact-requests/{requestId}/cancel:
    post:
      operationId: cancelContactRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: Cancelled request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactRequestResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/contacts:
    get:
      operationId: listContacts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContactSummary' }
  /api/v1/contacts/{userId}:
    delete:
      operationId: removeContact
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Contact removed; history remains read-only }
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/blocks/{userId}:
    post:
      operationId: blockUser
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: User blocked }
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: unblockUser
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: User unblocked; contact is not restored }
  /api/v1/conversations:
    get:
      operationId: listConversations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: C2C conversations, including read-only history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationSummary' }
  /api/v1/conversations/{conversationId}/read:
    get:
      operationId: getConversationReadState
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: User-level read state for both C2C participants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationReadStatePage' }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: markConversationRead
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [readSeq]
              properties:
                readSeq: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Monotonically advanced user-level read state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationReadStatePage' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - name: afterSeq
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: Authoritative messages ordered by conversation sequence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessagePage' }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: sendConversationText
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendTextMessageRequest' }
      responses:
        '200':
          description: Durable message acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/devices/push-token:
    post:
      operationId: updateDevicePushToken
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, tokenVersion]
              properties:
                token: { type: string, minLength: 1, maxLength: 4096 }
                tokenVersion: { type: integer, format: int64, minimum: 0 }
      responses:
        '204':
          description: Push token stored for the authenticated MOBILE device
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /api/v1/media/images:
    post:
      operationId: uploadMessageImage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: uploadId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Validated and normalized private temporary media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
    get:
      description: Not supported
      responses:
        '405':
          $ref: '#/components/responses/ApiError'
  /api/v1/media/{mediaId}:
    get:
      operationId: downloadPrivateMedia
      security: [{ bearerAuth: [] }]
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: query
          schema: { type: string, enum: [full, thumb], default: full }
      responses:
        '200':
          description: Authorized normalized image bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '410':
          $ref: '#/components/responses/ApiError'

  /api/v1/sync:
    get:
      operationId: getUserSyncPage
      summary: Read a bounded page of the authenticated user's durable sync stream
      security: [{ bearerAuth: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: until
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: Ordered sync events and the fixed high-watermark boundary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPage' }
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          description: Cursor is outside the retained event window
          content:
            application/json:
              schema: { $ref: './schemas/error-response-v1.schema.json' }
  /api/v1/sync/ack:
    post:
      operationId: acknowledgeUserSync
      summary: Acknowledge sync progress for the authenticated device only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [syncSeq]
              properties:
                syncSeq: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Device-scoped cursor acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncAckResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CropX:
      name: cropX
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    CropY:
      name: cropY
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    CropWidth:
      name: cropWidth
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    CropHeight:
      name: cropHeight
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ContactSearchResult:
      type: object
      additionalProperties: false
      required: [version, accountNo, displayName, avatarVersion, avatarFallback, relationship]
      properties:
        version: { const: 1 }
        accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        avatarVersion: { type: integer, format: int64, minimum: 0 }
        avatarFallback: { type: string, minLength: 1, maxLength: 2 }
        relationship:
          type: string
          enum: [NONE, PENDING_OUTGOING, PENDING_INCOMING, ACTIVE, REMOVED]
        pendingRequestId: { type: [string, 'null'], format: uuid }
    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [accountNo]
      properties:
        accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        verification: { type: string, maxLength: 100 }
    ContactRequestResponse:
      type: object
      additionalProperties: false
      required: [version, requestId, requesterId, recipientId, status, verification, expiresAt]
      properties:
        version: { const: 1 }
        requestId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, EXPIRED] }
        verification: { type: string }
        expiresAt: { type: string, format: date-time }
        conversationId: { type: [string, 'null'], format: uuid }
    ContactRequestSummary:
      allOf:
        - $ref: '#/components/schemas/ContactRequestResponse'
        - type: object
          required: [incoming, peerAccountNo, peerDisplayName]
          properties:
            incoming: { type: boolean }
            peerAccountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
            peerDisplayName: { type: string }
    ContactSummary:
      type: object
      required: [version, userId, accountNo, displayName, conversationId, relationship, avatarVersion]
      properties:
        version: { const: 1 }
        userId: { type: string, format: uuid }
        accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        displayName: { type: string }
        conversationId: { type: string, format: uuid }
        relationship: { const: ACTIVE }
        avatarUrl: { type: [string, 'null'] }
        avatarVersion: { type: integer, format: int64, minimum: 0 }
    ConversationSummary:
      type: object
      required: [version, conversationId, peerUserId, peerAccountNo, peerDisplayName, status, relationship, blockedByMe, readSeq, peerReadSeq, avatarVersion]
      properties:
        version: { const: 1 }
        conversationId: { type: string, format: uuid }
        peerUserId: { type: string, format: uuid }
        peerAccountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        peerDisplayName: { type: string }
        status: { type: string, enum: [ACTIVE, READ_ONLY, DISSOLVED] }
        relationship: { type: string, enum: [ACTIVE, READ_ONLY] }
        blockedByMe: { type: boolean }
        readSeq: { type: integer, format: int64, minimum: 0 }
        peerReadSeq: { type: integer, format: int64, minimum: 0 }
        avatarUrl: { type: [string, 'null'] }
        avatarVersion: { type: integer, format: int64, minimum: 0 }
    AvatarUploadResponse:
      type: object
      additionalProperties: false
      required: [version, mediaId, purpose, state, contentType, width, height, byteSize, avatarVersion, thumbnailUrl]
      properties:
        version: { const: 1 }
        mediaId: { type: string, format: uuid }
        purpose: { const: AVATAR }
        state: { const: BOUND }
        contentType: { const: image/webp }
        width: { const: 512 }
        height: { const: 512 }
        byteSize: { type: integer, minimum: 1 }
        avatarVersion: { type: integer, format: int64, minimum: 1 }
        thumbnailUrl: { type: string }
    UserProfile:
      type: object
      additionalProperties: false
      required: [userId, displayName, avatarUrl, avatarVersion, avatarFallback]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        avatarVersion: { type: integer, format: int64, minimum: 0 }
        avatarFallback: { type: string, minLength: 1, maxLength: 2 }
    GroupProfile:
      type: object
      additionalProperties: false
      required: [conversationId, avatarUrl, avatarVersion]
      properties:
        conversationId: { type: string, format: uuid }
        avatarUrl: { type: [string, 'null'] }
        avatarVersion: { type: integer, format: int64, minimum: 0 }
    ConversationReadState:
      type: object
      additionalProperties: false
      required: [conversationId, userId, readSeq]
      properties:
        conversationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        readSeq: { type: integer, format: int64, minimum: 0 }
    ConversationReadStatePage:
      type: object
      additionalProperties: false
      required: [version, conversationId, states]
      properties:
        version: { const: 1 }
        conversationId: { type: string, format: uuid }
        states:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ConversationReadState' }
    SendTextMessageRequest:
      type: object
      additionalProperties: false
      required: [clientMsgId]
      properties:
        clientMsgId: { type: string, format: uuid }
        type: { type: string, enum: [TEXT, IMAGE] }
        text: { type: [string, 'null'], minLength: 1, maxLength: 4000 }
        mediaId: { type: [string, 'null'], format: uuid }
    Message:
      type: object
      additionalProperties: false
      required:
        [messageId, conversationId, senderId, clientMsgId, conversationSeq,
         type, state, text, mediaId, serverAcceptedAt]
      properties:
        messageId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        clientMsgId: { type: string, format: uuid }
        conversationSeq: { type: integer, format: int64, minimum: 1 }
        type: { type: string, enum: [TEXT, IMAGE] }
        state: { const: ACTIVE }
        text: { type: [string, 'null'] }
        mediaId: { type: [string, 'null'], format: uuid }
        serverAcceptedAt: { type: string, format: date-time }
    ConversationMessagePage:
      type: object
      additionalProperties: false
      required: [version, conversationId, messages]
      properties:
        version: { const: 1 }
        conversationId: { type: string, format: uuid }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
    MediaUploadResponse:
      type: object
      additionalProperties: false
      required: [version, mediaId, purpose, state, contentType, width, height, byteSize, sha256]
      properties:
        version: { const: 1 }
        mediaId: { type: string, format: uuid }
        purpose: { const: MESSAGE_IMAGE }
        state: { const: TEMP }
        contentType: { const: image/jpeg }
        width: { type: integer, minimum: 1, maximum: 2048 }
        height: { type: integer, minimum: 1, maximum: 2048 }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    SyncEvent:
      type: object
      additionalProperties: false
      required: [syncSeq, eventType, entityId, conversationId, createdAt]
      properties:
        syncSeq: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string }
        entityId: { type: string, format: uuid }
        conversationId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    SyncPage:
      type: object
      additionalProperties: false
      required: [version, afterSeq, highWatermark, untilSeq, nextAfterSeq, hasMore, events]
      properties:
        version: { const: 1 }
        afterSeq: { type: integer, format: int64, minimum: 0 }
        highWatermark: { type: integer, format: int64, minimum: 0 }
        untilSeq: { type: integer, format: int64, minimum: 0 }
        nextAfterSeq: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/SyncEvent' }
    SyncAckResponse:
      type: object
      additionalProperties: false
      required: [version, deviceId, ackedSeq]
      properties:
        version: { const: 1 }
        deviceId: { type: string, format: uuid }
        ackedSeq: { type: integer, format: int64, minimum: 0 }
  responses:
    ApiError:
      description: Versioned error response
      headers:
        X-Request-Id:
          description: UUIDv4 request correlation identifier
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: './schemas/error-response-v1.schema.json'
