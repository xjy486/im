          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/ai/artifacts:
    get:
      operationId: listPrivateAiArtifacts
      summary: List unexpired private AI artifacts owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Private AI artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiArtifactResponse' }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/ai/artifacts/{artifactId}:
    delete:
      operationId: deletePrivateAiArtifact
      summary: Delete one private AI artifact owned by the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Private AI artifact deleted }
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/ai/action-items:
    get:
      operationId: listPrivateAiActionItems
      summary: List private action items owned by the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Private action items retained until completion or deletion
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiActionItemResponse' }
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/ai/action-items/{actionItemId}:
    patch:
      operationId: updatePrivateAiActionItem
      summary: Mark an owned private action item open or completed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: actionItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, COMPLETED] }
      responses:
        '200':
          description: Updated private action item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiActionItemResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: deletePrivateAiActionItem
      summary: Hard-delete an owned private action item
      security: [{ bearerAuth: [] }]
      parameters:
        - name: actionItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Private action item deleted }
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'

  /api/v1/sync:
    get:
      operationId: getUserSyncPage
      summary: Read a bounded page of the authenticated user's durable sync stream
      security: [{ bearerAuth: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: until
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: Ordered sync events and the fixed high-watermark boundary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPage' }
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          description: Cursor is outside the retained event window
          content:
            application/json:
              schema: { $ref: './schemas/error-response-v1.schema.json' }
  /api/v1/sync/ack:
    post:
      operationId: acknowledgeUserSync
      summary: Acknowledge sync progress for the authenticated device only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [syncSeq]
              properties:
                syncSeq: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Device-scoped cursor acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncAckResponse' }
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminApiKey:
      type: apiKey
      in: header
      name: X-Admin-Api-Key
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CropX:
      name: cropX
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    CropY:
      name: cropY
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    CropWidth:
      name: cropWidth
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    CropHeight:
      name: cropHeight
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        [version, userId, accountNo, accessToken, refreshToken,
         accessTokenExpiresAt, refreshTokenExpiresAt, deviceId, deviceClass,
         passwordMustChange]
      properties:
        version: { const: 1 }
        userId: { type: string, format: uuid }
        accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        accessToken: { type: string, minLength: 1 }
        refreshToken: { type: string, minLength: 1 }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshTokenExpiresAt: { type: string, format: date-time }
        deviceId: { type: string, format: uuid }
        deviceClass: { type: string, enum: [MOBILE, PC] }
        passwordMustChange: { type: boolean }
    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [version, temporaryPassword, passwordMustChange]
      properties:
        version: { const: 1 }
        temporaryPassword: { type: string, minLength: 1 }
        passwordMustChange: { type: boolean, const: true }
    AbuseReportCreateRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reasonCode]
      properties:
        targetType: { type: string, enum: [USER, GROUP, MESSAGE] }
        targetId: { type: string, format: uuid }
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
    AbuseReportResponse:
      type: object
      additionalProperties: false
      required:
        [version, reportId, reporterUserId, targetType, targetId, reasonCode,
         status, createdAt, updatedAt]
      properties:
        version: { const: 1 }
        reportId: { type: string, format: uuid }
        reporterUserId: { type: string, format: uuid }
        targetType: { type: string, enum: [USER, GROUP, MESSAGE] }
        targetId: { type: string, format: uuid }
        reasonCode: { type: string }
        status: { type: string, enum: [OPEN, REVIEWING, RESOLVED, DISMISSED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    PlatformSuspensionRequest:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
    AuditLogRecord:
      type: object
      additionalProperties: false
      required:
        [id, eventType, outcome, actorUserId, actorDeviceId, subjectType,
         subjectId, requestId, errorCode, occurredAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        outcome: { type: string, enum: [SUCCEEDED, REJECTED, FAILED] }
        actorUserId: { type: [string, 'null'], format: uuid }
        actorDeviceId: { type: [string, 'null'], format: uuid }
        subjectType: { type: [string, 'null'] }
        subjectId: { type: [string, 'null'], format: uuid }
        requestId: { type: [string, 'null'], format: uuid }
        errorCode: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '.*\S.*'
    ContactSearchResult:
      type: object
      additionalProperties: false
      required: [version, accountNo, displayName, avatarVersion, avatarFallback, relationship]
      properties:
        version: { const: 1 }
        accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        avatarVersion: { type: integer, format: int64, minimum: 0 }
        avatarFallback: { type: string, minLength: 1, maxLength: 2 }
        relationship:
          type: string
          enum: [NONE, PENDING_OUTGOING, PENDING_INCOMING, ACTIVE, REMOVED]
        pendingRequestId: { type: [string, 'null'], format: uuid }
    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [accountNo]
      properties:
        accountNo: { type: string, pattern: '^[1-9][0-9]{10}$' }
        verification: { type: string, maxLength: 100 }
    ContactRequestResponse:
      type: object
      additionalProperties: false
      required: [version, requestId, requesterId, recipientId, status, verification, expiresAt]
      properties:
        version: { const: 1 }
        requestId: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, EXPIRED] }
        verification: { type: string }
        expiresAt: { type: string, format: date-time }
        conversationId: { type: [string, 'null'], format: uuid }
    ContactRequestSummary:
