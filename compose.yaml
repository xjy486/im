name: jitong-im

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JITONG_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/v1/system/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jitong
      DB_USERNAME: jitong
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-up.sh first}
      DB_MAX_POOL_SIZE: 16
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?run scripts/dev-up.sh first}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/dev-up.sh first}
      MINIO_BUCKET: ${MINIO_BUCKET:-jitong-media}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m -XX:MaxMetaspaceSize=192m
    networks:
      - backend
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jitong
      POSTGRES_USER: jitong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-up.sh first}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/dev-up.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/dev-up.sh first}
    volumes:
      - minio_data:/data
    networks:
      - backend
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
