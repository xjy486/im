name: jitong-im

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JITONG_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/v1/system/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  server:
    image: ${JITONG_SERVER_IMAGE:-jitong-im-server:local}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jitong
      DB_USERNAME: jitong
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-up.sh first}
      DB_MAX_POOL_SIZE: 16
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?run scripts/dev-up.sh first}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/dev-up.sh first}
      MINIO_BUCKET: ${MINIO_BUCKET:-jitong-media}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?run scripts/dev-up.sh first}
      # The local stack is reached from the Android Emulator through the
      # host alias below. Production overrides this in compose.production.yaml.
      GROUP_INVITE_DEEP_LINK_BASE: ${GROUP_INVITE_DEEP_LINK_BASE:-http://10.0.2.2:8080/groups/invite}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_TOKEN_ENCRYPTION_KEY: ${FCM_TOKEN_ENCRYPTION_KEY:-}
      AI_PROVIDER_ENABLED: ${AI_PROVIDER_ENABLED:-false}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4o-mini}
      AI_PROVIDER_REQUEST_TIMEOUT: ${AI_PROVIDER_REQUEST_TIMEOUT:-90s}
      AI_PROVIDER_SUPPORTS_VISION: ${AI_PROVIDER_SUPPORTS_VISION:-false}
      AI_IMAGE_INPUT_ENABLED: ${AI_IMAGE_INPUT_ENABLED:-false}
      AI_WORKER_POLL_INTERVAL: ${AI_WORKER_POLL_INTERVAL:-250}
      AI_WORKER_LEASE_TIMEOUT: ${AI_WORKER_LEASE_TIMEOUT:-2m}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-100000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8192}
      AI_RETENTION_INTERVAL: ${AI_RETENTION_INTERVAL:-60000}
      AI_RETENTION_INITIAL_DELAY: ${AI_RETENTION_INITIAL_DELAY:-60000}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m -XX:MaxMetaspaceSize=192m
    networks:
      - backend
    cpus: 0.75
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jitong
      POSTGRES_USER: jitong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-up.sh first}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/dev-up.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/dev-up.sh first}
    volumes:
      - minio_data:/data
    networks:
      - backend
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
